# https://docs.codecov.io/docs/codecov-yaml
# https://github.com/codecov/support/wiki/Codecov-Yaml

coverage:
  status:
    project:
      default: false
    patch:
      default: false
  fixes:
    - "build/src/::src/"

comment:
  layout: "diff"

flags:
  production:
    paths:
      - src/StyleCop.Analyzers/
      - src/StyleCop.Analyzers.CodeFixes/
  test:
    paths:
      - test/StyleCop.Analyzers.Test/
      - tools/StyleCopTester/
