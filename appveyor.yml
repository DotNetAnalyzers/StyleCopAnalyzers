# AppVeyor is retired: CI runs on GitHub Actions (.github/workflows/build.yml).
#
# This file is intentionally kept. The AppVeyor project (ci.appveyor.com/project/sharwell/stylecopanalyzers)
# has "skip branches without appveyor.yml" turned off, so deleting this file would make AppVeyor fall back to
# the build settings in its web UI and keep building. These settings stop webhook-triggered builds instead.
# This file can be deleted once a maintainer removes the AppVeyor project or its GitHub webhook.

# Only build a branch that doesn't exist. Note: per AppVeyor docs, "only" does not exclude PRs based on a listed branch.
branches:
  only:
    - __appveyor_disabled__

# Skip every push and pull request, whatever the commit message (regex matched against the commit message title).
skip_commits:
  message: /.*/

skip_tags: true

# If a build is started anyway (UI, API, or schedule, which ignore the filters above), do nothing.
build: off
test: off
