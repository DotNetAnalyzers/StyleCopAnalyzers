name: Link issue diagnostics

on:
  issues:
    types: [ opened ]

permissions: {}

jobs:
  link-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install Markdown parser
      working-directory: build/issue-links
      run: npm ci --ignore-scripts

    - name: Link diagnostic references
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      with:
        script: |
          const { updateIssue } = await import(
            `${process.env.GITHUB_WORKSPACE}/build/issue-links/index.mjs`);
          await updateIssue(github, context);
